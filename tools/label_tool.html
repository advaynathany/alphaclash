<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AlphaClash labeler</title>
<style>
  :root { --bg:#16181c; --panel:#1f2228; --line:#30343c; --text:#e6e8eb; --dim:#8b919c;
          --mine:#4d9bff; --enemy:#ff5a5a; --none:#c8c8c8; --accent:#f4c542; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, system-ui, sans-serif;
         display:grid; grid-template-columns:auto 320px; height:100vh; overflow:hidden; }
  #stage { position:relative; display:flex; align-items:center; justify-content:center; padding:12px; min-width:0; }
  canvas { display:block; max-height:calc(100vh - 24px); cursor:crosshair; border-radius:6px; }
  aside { background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:15px; }
  .row { display:flex; gap:8px; align-items:center; }
  .dim { color:var(--dim); font-size:12px; }
  .badge { font-size:11px; padding:2px 7px; border-radius:99px; border:1px solid var(--line); }
  .badge.model { color:var(--accent); border-color:var(--accent); }
  .badge.saved { color:#7bd88f; border-color:#7bd88f; }
  section { padding:12px 16px; border-bottom:1px solid var(--line); }
  input[type=text] { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line);
                     border-radius:6px; padding:7px 9px; font:inherit; }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px;
           padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.on { border-color:currentColor; }
  button.mine { color:var(--mine); } button.enemy { color:var(--enemy); } button.none { color:var(--none); }
  #boxes { flex:1; overflow:auto; padding:6px 8px; margin:0; list-style:none; }
  #boxes li { padding:5px 8px; border-radius:5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  #boxes li.sel { background:#2c313a; }
  #boxes li .s { font-size:12px; }
  kbd { font:11px ui-monospace, monospace; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  footer { padding:10px 16px; font-size:12px; color:var(--dim); border-top:1px solid var(--line); line-height:1.9; }
  #toast { position:absolute; top:18px; left:50%; transform:translateX(-50%); background:#2c313a; padding:6px 12px;
           border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>
<aside>
  <header>
    <h1 id="title">…</h1>
    <div class="row"><span id="progress" class="dim"></span><span id="source" class="badge"></span></div>
  </header>
  <section>
    <label class="dim" for="cls">Class of selected box (new boxes reuse the last one)</label>
    <input id="cls" type="text" list="classes" autocomplete="off" spellcheck="false">
    <datalist id="classes"></datalist>
    <div class="row" style="margin-top:8px">
      <button class="mine" data-side="mine">Mine <kbd>M</kbd></button>
      <button class="enemy" data-side="enemy">Enemy <kbd>E</kbd></button>
      <button class="none" data-side="">None <kbd>N</kbd></button>
    </div>
  </section>
  <ul id="boxes"></ul>
  <footer>
    Drag on empty space: new box · drag a box: move · drag a corner: resize<br>
    <kbd>⌫</kbd> delete · <kbd>Tab</kbd> next box · <kbd>/</kbd> edit class<br>
    <kbd>←</kbd><kbd>→</kbd> prev/next image (saves) · <kbd>S</kbd> save
  </footer>
</aside>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const clsInput = document.getElementById('cls');
let images = [], classes = [], idx = 0, boxes = [], sel = -1, img = new Image(), dirty = false;
let lastClass = 'knight', drag = null;
const COLOR = { mine: '#4d9bff', enemy: '#ff5a5a', null: '#c8c8c8' };
const HANDLE = 7;

async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.opacity = 0, 1200); }

async function init() {
  const d = await api('/api/list');
  images = d.images; classes = d.classes;
  document.getElementById('classes').innerHTML = classes.map(c => `<option value="${c}">`).join('');
  const first = images.findIndex(i => !i.done);
  await load(first < 0 ? 0 : first);
}

async function load(i) {
  idx = (i + images.length) % images.length;
  const stem = images[idx].stem;
  const d = await api('/api/labels/' + stem);
  boxes = d.boxes.map(b => ({ ...b, side: b.side ?? null })); sel = -1; dirty = false;
  const src = document.getElementById('source');
  src.textContent = { saved: 'saved', model: 'model guesses — check them', empty: 'no labels yet' }[d.source];
  src.className = 'badge ' + d.source;
  document.getElementById('title').textContent = stem;
  updateProgress();
  img = new Image();
  img.onload = () => { cv.width = img.width; cv.height = img.height; draw(); list(); };
  img.src = '/api/image/' + stem;
}

function updateProgress() {
  const done = images.filter(i => i.done).length;
  document.getElementById('progress').textContent = `${idx + 1} / ${images.length} · ${done} reviewed`;
}

async function save() {
  const stem = images[idx].stem;
  const r = await api('/api/labels/' + stem, { method: 'PUT', body: JSON.stringify(boxes) });
  images[idx].done = true; dirty = false; updateProgress();
  document.getElementById('source').textContent = 'saved'; document.getElementById('source').className = 'badge saved';
  toast(`saved ${r.saved} boxes`);
}

function draw() {
  ctx.drawImage(img, 0, 0);
  boxes.forEach((b, i) => {
    const [x0, y0, x1, y1] = b.xyxy, c = COLOR[b.side];
    ctx.lineWidth = i === sel ? 3 : 1.5; ctx.strokeStyle = c;
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.font = '11px -apple-system, system-ui'; const w = ctx.measureText(b.name).width + 6;
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(x0, y0 - 14, w, 14);
    ctx.fillStyle = c; ctx.fillText(b.name, x0 + 3, y0 - 3);
    if (i === sel) { ctx.fillStyle = c; for (const [hx, hy] of corners(b)) ctx.fillRect(hx - 3, hy - 3, 6, 6); }
  });
}

function list() {
  const ul = document.getElementById('boxes');
  ul.innerHTML = boxes.map((b, i) =>
    `<li data-i="${i}" class="${i === sel ? 'sel' : ''}"><span>${b.name}</span><span class="s" style="color:${COLOR[b.side]}">${b.side ?? '—'}</span></li>`).join('')
    || '<li class="dim">No boxes. Drag on the image to add one.</li>';
  clsInput.value = sel >= 0 ? boxes[sel].name : '';
  document.querySelectorAll('[data-side]').forEach(btn =>
    btn.classList.toggle('on', sel >= 0 && (boxes[sel].side ?? '') === btn.dataset.side));
}

function select(i) { sel = i; draw(); list(); }
function corners(b) { const [x0, y0, x1, y1] = b.xyxy; return [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]; }
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; }
function inside(b, x, y) { const [x0, y0, x1, y1] = b.xyxy; return x >= x0 && x <= x1 && y >= y0 && y <= y1; }

cv.addEventListener('mousedown', e => {
  const [x, y] = pos(e);
  if (sel >= 0) {
    const k = corners(boxes[sel]).findIndex(([hx, hy]) => Math.abs(hx - x) < HANDLE && Math.abs(hy - y) < HANDLE);
    if (k >= 0) { drag = { mode: 'resize', k }; return; }
  }
  // smallest box under the cursor wins, so nested units stay clickable
  const hits = boxes.map((b, i) => [b, i]).filter(([b]) => inside(b, x, y))
    .sort(([a], [b]) => (a.xyxy[2] - a.xyxy[0]) * (a.xyxy[3] - a.xyxy[1]) - (b.xyxy[2] - b.xyxy[0]) * (b.xyxy[3] - b.xyxy[1]));
  if (hits.length) { select(hits[0][1]); drag = { mode: 'move', x, y, orig: [...boxes[sel].xyxy] }; return; }
  // guess the side from the half of the arena; fix with M/E when wrong
  boxes.push({ name: lastClass, side: y > cv.height / 2 ? 'mine' : 'enemy', xyxy: [x, y, x, y] });
  select(boxes.length - 1); drag = { mode: 'new', x, y }; dirty = true;
});
window.addEventListener('mousemove', e => {
  if (!drag || sel < 0) return;
  const [x, y] = pos(e), b = boxes[sel];
  if (drag.mode === 'new') b.xyxy = [Math.min(drag.x, x), Math.min(drag.y, y), Math.max(drag.x, x), Math.max(drag.y, y)];
  else if (drag.mode === 'move') { const dx = x - drag.x, dy = y - drag.y, o = drag.orig; b.xyxy = [o[0] + dx, o[1] + dy, o[2] + dx, o[3] + dy]; }
  else { const c = b.xyxy; if (drag.k % 2 === 0) c[0] = x; else c[2] = x; if (drag.k < 2) c[1] = y; else c[3] = y;
         b.xyxy = [Math.min(c[0], c[2]), Math.min(c[1], c[3]), Math.max(c[0], c[2]), Math.max(c[1], c[3])]; }
  dirty = true; draw();
});
window.addEventListener('mouseup', () => {
  if (drag && drag.mode === 'new' && sel >= 0) {
    const [x0, y0, x1, y1] = boxes[sel].xyxy;
    if (x1 - x0 < 4 || y1 - y0 < 4) { boxes.splice(sel, 1); sel = -1; }  // a click, not a box
    else { clsInput.focus(); clsInput.select(); }
  }
  drag = null; draw(); list();
});

document.getElementById('boxes').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); if (li) select(+li.dataset.i); });
document.querySelectorAll('[data-side]').forEach(btn => btn.addEventListener('click', () => setSide(btn.dataset.side || null)));
function setSide(s) { if (sel < 0) return; boxes[sel].side = s; dirty = true; draw(); list(); }

clsInput.addEventListener('change', commitClass);
clsInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { commitClass(); clsInput.blur(); }
  if (e.key === 'Escape') { clsInput.value = sel >= 0 ? boxes[sel].name : ''; clsInput.blur(); }
  e.stopPropagation();
});
function commitClass() {
  const v = clsInput.value.trim();
  if (sel < 0 || !v) return;
  if (!classes.includes(v)) { toast(`unknown class "${v}"`); clsInput.value = boxes[sel].name; return; }
  boxes[sel].name = lastClass = v; dirty = true; draw(); list();
}

window.addEventListener('keydown', async e => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowright' || k === 'arrowleft') { e.preventDefault(); await save(); await load(idx + (k === 'arrowright' ? 1 : -1)); }
  else if (k === 's') { e.preventDefault(); await save(); }
  else if ((k === 'backspace' || k === 'delete') && sel >= 0) { e.preventDefault(); boxes.splice(sel, 1); sel = -1; dirty = true; draw(); list(); }
  else if (k === 'm') setSide('mine'); else if (k === 'e') setSide('enemy'); else if (k === 'n') setSide(null);
  else if (k === 'tab') { e.preventDefault(); if (boxes.length) select((sel + (e.shiftKey ? -1 : 1) + boxes.length) % boxes.length); }
  else if (k === '/') { e.preventDefault(); if (sel >= 0) { clsInput.focus(); clsInput.select(); } }
});
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });
init();
</script>
</body>
</html>
