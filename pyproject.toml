[project]
name = "alphaclash"
version = "0.1.0"
description = "Learning agent for Clash Royale on an Android emulator"
readme = "README.md"
authors = [
    { name = "advaynathany", email = "77192161+advaynathany@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyobjc-framework-quartz>=12.2.2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
